[project]
name = "structural-screening-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "google-genai>=1.30.0",
  "openai>=1.76.0",
  "pydantic>=2.11.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "reportlab>=4.4.1",
  "streamlit>=1.44.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
