- basis_id: gb_portal_frame_purlin_screening
  source_type: standard
  title_en: GB Portal Frame Purlin Screening Basis
  title_zh: GB 门式刚架檩条筛查依据
  citation_en: Screening-level purlin check for portal-frame roofs with photovoltaic dead load increase; use for boundary screening before formal structural review.
  citation_zh: 适用于门式刚架屋面光伏增载后的檩条筛查；在正式结构复核前用于边界筛查。
  applicable_standards:
    - gb
  trigger_conditions:
    - screening-stage portal-frame purlin check
    - roof photovoltaic load increase requires screening
  review_requirements:
    - Escalate to formal review if purlin utilization, deflection, or support reactions exceed screening thresholds
    - Perform deeper review for portal-frame roof load path and local connection effects
  evidence_requirements:
    - portal frame geometry
    - purlin spacing and section data
    - roof photovoltaic load summary
    - structural drawings
